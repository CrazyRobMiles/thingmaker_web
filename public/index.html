<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thingmaker</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<header id="toolbar">
  <div class="menu" id="file-menu">
    <button type="button" class="menu-button">File &#9662;</button>
    <div class="menu-items">
      <button type="button" data-action="new">New<span class="key">Ctrl+N</span></button>
      <button type="button" data-action="open">Open...<span class="key">Ctrl+O</span></button>
      <button type="button" data-action="save">Save<span class="key">Ctrl+S</span></button>
      <button type="button" data-action="save-as">Save As...<span class="key">Ctrl+Shift+S</span></button>
      <button type="button" data-action="earlier-versions">Earlier versions...</button>
      <hr>
      <button type="button" data-action="open-stl">Open STL files...</button>
      <hr>
      <button type="button" data-action="new-subassembly">New subassembly...</button>
      <button type="button" data-action="edit-subassembly">Edit subassembly...</button>
      <hr data-action-group="folder" hidden>
      <button type="button" data-action="fonts" hidden>Fonts...</button>
      <button type="button" data-action="change-folder" hidden>Change folder...</button>
    </div>
  </div>
  <span class="sep"></span>
  <button type="button" data-action="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button type="button" data-action="redo" title="Redo (Ctrl+Y)">Redo</button>
  <span class="sep"></span>
  <button type="button" data-action="add-case" title="Add a box with a lid">Add case...</button>
  <button type="button" data-action="add-hinge" title="Join two cases with a hinge">Add hinge...</button>
  <button type="button" data-action="add-device" title="Place a device on a surface">Add device...</button>
  <button type="button" data-action="add-subassembly" title="Place a subassembly (made from STL files) on a surface">Add subassembly...</button>
  <button type="button" data-action="delete" title="Delete the selected case, hinge, device or subassembly">Delete</button>
  <span class="sep"></span>
  <button type="button" data-action="build" id="build-button" title="Write the parts out as STL files for printing (F5)">Build</button>
  <span class="sep"></span>
  <span class="toggle-group">
    <button type="button" data-view="design" class="on" title="Edit the design: cases, hinges, devices and subassemblies">Design</button>
    <button type="button" data-view="print" title="Show the printable STL files side by side">Print parts</button>
  </span>
  <span class="sep"></span>
  <label class="check" title="Show the cases as simple layout panels"><input type="checkbox" data-option="layout"> Layout</label>
  <label class="check" title="Show lids (hide them to reach inside surfaces)"><input type="checkbox" data-option="lids" checked> Lids</label>
  <label class="check" title="Show the real parts, rebuilt as you edit"><input type="checkbox" data-option="built" checked> Built model</label>
  <span class="sep"></span>
  <button type="button" data-action="fit" title="Fit the whole design in the view (F)">Fit view</button>
</header>

<main id="main">
  <section id="viewport" tabindex="0" aria-label="3D view">
    <div id="axes"></div>
  </section>
  <div id="splitter" title="Drag to resize"></div>
  <aside id="sidebar">
    <div class="panel" id="tree-panel"><h2>Design</h2><div id="tree"></div></div>
    <div class="panel grow" id="props-panel"><div id="props"></div></div>
    <div class="panel" id="problems-panel"><h2>Problems</h2><ul id="problems"></ul></div>
  </aside>
</main>

<section id="log-panel" hidden>
  <div class="log-head"><h2>Build log</h2><button type="button" id="log-close" title="Hide the build log">&times;</button></div>
  <pre id="log"></pre>
</section>

<footer id="statusbar">
  <span id="status">Click a surface to select it, right-click it to add a device or subassembly. Drag one to move it.</span>
  <span id="built-label"></span>
</footer>

<div id="context-menu" class="popup" hidden></div>
<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
